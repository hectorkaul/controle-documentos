spring.application.name=controle-documentos

# banco em arquivo, para os dados continuarem la depois de reiniciar
spring.datasource.url=jdbc:h2:file:./data/documentos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# console do H2 em http://localhost:8080/h2-console (JDBC URL acima)
spring.h2.console.enabled=true

# com quantos dias de antecedencia o documento passa a aparecer como "vence em breve"
documentos.dias-de-aviso=30
